# Single source of truth. Every other config `extends` this one.
# Runtime (sync service) and training (ml/) both read it.
seed: 0

sync:
  model: "gpt-5.6-luna"          # any OpenAI-compatible model id; verified against /v1/models on first use
  base_url: null                  # null = OPENAI_BASE_URL env or api.openai.com
  prompt_version: "v1"            # which prompts/system_<v>.md to use; logged with every interaction
  max_edits: 6                    # server rejects responses with more block edits than this
  context_blocks: 1               # neighbours on each side of an affected block that the model may also edit
  timeout_s: 60
  service_tier: null              # e.g. "priority" for lower latency at higher cost (Responses API)
  reasoning_effort: "low"         # null = model default. low: same 3/3 on eval_v0, p50 2.4s->1.9s warm (2026-08-26)
  preview: true                   # stream partial block text to the editor while an edit is generated
  preview_interval_ms: 150
  temperature: null            # null = omit (reasoning models reject it)

window:                           # long files: render only editable blocks +- radius in full
  max_full_blocks: 14             # pairs with at most this many blocks are always sent in full
  radius: 2                       # blocks of full context on each side of the editable set

segment:
  min_block_lines: 3              # consecutive small top-level nodes (imports, constants) are merged until >= this

verify:                           # code-side checks after edits are applied (see sync/src/prosesync/verify/)
  enabled: false                  # tree-sitter (all languages) + ast.parse (python) + optional command below
  repair_rounds: 1                # on failure, ask the model once for corrected edits; keep them only if they pass
  command_timeout_s: 60
  commands: {}                    # per language; "{file}" is the candidate, e.g. typescript: ["npx", "tsc", "--noEmit", "{file}"]

log:
  enabled: true
  dir: "~/.prosecode/logs"

server:
  host: "127.0.0.1"
  port: 0                         # 0 = pick a free port and print it (the extension reads it from stdout)
