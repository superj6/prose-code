# CPU smoke test on the locally cached Qwen3-0.6B: a few steps on the tiny example files.
extends: train_base.yaml
device: "cpu"
model:
  name: "Qwen/Qwen3-0.6B"
  dtype: "float32"
train:
  autocast_dtype: null
lora:
  r: 4
  alpha: 8
sft:
  train_path: "outputs/data/train.jsonl"
  val_path: "outputs/data/val.jsonl"
  out_dir: "outputs/sft_smoke"
  epochs: 1
  batch_size: 1
  max_length: 1024
  max_steps: 2
  log_interval: 1
  eval_every: 2
  save_every: 1000
  max_train_examples: 2
  max_val_examples: 1
