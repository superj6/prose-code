[project]
name = "prosesync"
version = "0.1.0"
description = "Keeps an English prose-code file and its source file in sync with an LLM"
requires-python = ">=3.10"
dependencies = [
  "openai>=3.0",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "tree-sitter-language-pack>=0.7",
  "omegaconf>=2.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
develop = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
prosesync = "prosesync.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prosesync = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
